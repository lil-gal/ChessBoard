<style>

    
    * {
        margin: 0px;
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-weight: 550;
    }
    
    html, body {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        
        background-color: rgb(37,37,37);
        
        /* VARIABLES :D */
        --white-color: white;
        --black-color: rgb(141, 71, 182);
        
    }

    .square {
        display: flex;
        padding: 4px;
    }

    .square > p {
        font-size: 2.4vh;
    }
    
    .black {
        background-color: var(--black-color);;
        color: var(--white-color);
    }
    .white {
        background-color: var(--white-color);
        color: var(--black-color);;
    }
    
    .bottomRowP {
        margin-left: auto;
        align-self: end;
    }

    .leftColumnP {
        justify-self: start;
        align-self: start;
    }



    #chessBoard {
        display: grid;
        grid-template-columns: repeat(8,1fr);
        grid-template-rows: repeat(8,1fr);

        height: 70%;
        aspect-ratio: 1;
    }
</style>
